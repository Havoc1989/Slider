<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Archivio Clienti</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f5f5f7; color: #1d1d1f; }
    h1 { text-align: center; font-size: 24px; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #d2d2d7; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
    a { display: block; padding: 15px; margin: 10px 0; background: #007AFF; color: white; text-decoration: none; border-radius: 10px; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    a:active { background: #005bb5; }
  </style>
</head>
<body>
  <h1>Progetti Clienti</h1>
  <input type="text" id="cerca" placeholder="Cerca cliente..." onkeyup="filtra()">
  
  <div id="lista">
    <a href="Rossi.html">Rossi</a>
    <!-- Aggiungi qui sotto i prossimi clienti copiando la riga sopra -->
  </div>

  <script>
    function filtra() {
      const testo = document.getElementById('cerca').value.toLowerCase();
      document.querySelectorAll('#lista a').forEach(a => {
        a.style.display = a.textContent.toLowerCase().includes(testo) ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
